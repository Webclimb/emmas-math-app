<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Sky · Practice: sharing, hands-on (reference)</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 24px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .bar .ns-parts { flex: 1 1 300px; }
  .q { display: flex; flex-wrap: wrap; gap: 28px; }
  .q main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
  .q aside { flex: 1 1 220px; display: flex; flex-direction: column; gap: 10px; padding-left: 24px; border-left: 1.5px solid var(--line); }
  .work { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  .work .ns-tray { flex: 0 1 200px; min-height: 180px; }
  .plates { flex: 1 1 420px; display: flex; justify-content: space-around; gap: 12px; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; min-height: 52px; }
  .foot > div { flex: 1 1 320px; }
  .theme-switch { position: fixed; right: 12px; bottom: 12px; }
  @media (max-width: 719px) {
    .wrap { padding-top: 16px; gap: 12px; }
    .stop-label { display: none; }
    .bar { gap: 10px 12px; }
    .bar .ns-parts { order: 2; flex: 1 1 140px; }
    .bar .ns-gems { order: 3; }
    .bar .ns-chip { order: 4; }
    .bar .ns-level { order: 5; }
    .q { gap: 12px; }
    .q aside { padding-left: 0; border-left: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .q aside h2, .q aside p { display: none; }
    .q aside .ns-btn--aside { flex-direction: column; justify-content: center; min-height: 60px; gap: 3px; font-size: 14px; padding: 0 6px; text-align: center; }
    .work .ns-tray { max-width: none; min-height: 0; }
    .work > svg { display: none; }
    .plates { flex-basis: 100%; }
  }
</style>
</head>
<body class="ns ns-page" data-theme="light">
<div class="wrap">
  <header class="bar">
    <button class="ns-btn" aria-label="Stop for now"><!--kit:icon-close--><span class="stop-label">Stop for now</span></button>
    <span class="ns-chip">Sharing equally</span>
    <span class="ns-level"><i class="on"></i><i></i><i></i><span>Hands-on</span></span>
    <div class="ns-parts" role="img" aria-label="Part 2 of 4: focus">
      <div class="ns-part done"><div class="ns-part__rail"><span class="ns-part__dot"></span></div><span class="ns-part__label"><!--kit:icon-check-->Warm-up</span></div>
      <div class="ns-part now"><div class="ns-part__rail"><span class="ns-part__dot"></span></div><span class="ns-part__label">Focus</span></div>
      <div class="ns-part"><div class="ns-part__rail"><span class="ns-part__dot"></span></div><span class="ns-part__label">Facts</span></div>
      <div class="ns-part"><div class="ns-part__rail"><span class="ns-part__dot"></span></div><span class="ns-part__label">Wrap-up</span></div>
    </div>
    <span class="ns-gems" aria-label="46 gems"><!--kit:gem--> 46</span>
  </header>

  <div class="ns-card q">
    <main>
      <div style="display: flex; gap: 16px; align-items: flex-start">
        <p class="ns-prompt" style="flex: 1">Share <b>15</b> tickets equally onto <b>3</b> plates. Click a plate to put one ticket on it.</p>
        <button class="ns-btn ns-btn--icon" aria-label="Read aloud"><!--kit:icon-read-aloud--></button>
      </div>
      <div class="ns-strip" id="strip" aria-live="polite"></div>
      <div class="work">
        <div class="ns-tray"><span role="status" aria-live="polite" id="left"></span><div class="ns-tray__items" id="pool"></div></div>
        <svg width="32" height="24" viewBox="0 0 40 24" aria-hidden="true" style="color: var(--ink-soft)"><path d="M2 12h34M28 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="plates" id="plates"></div>
      </div>
      <div class="foot">
        <div id="status" role="status" aria-live="polite"></div>
        <button class="ns-btn" id="undo"><!--kit:icon-undo--> Undo</button>
      </div>
    </main>
    <aside aria-label="Help">
      <h2 class="ns-h2" style="font-size: 18px">Need a hand?</h2>
      <button class="ns-btn ns-btn--aside"><!--kit:icon-hint--> Hint</button>
      <button class="ns-btn ns-btn--aside"><!--kit:icon-show-me-how--> Show me how</button>
      <button class="ns-btn ns-btn--aside"><!--kit:icon-not-sure--> I'm not sure</button>
      <p class="ns-small" style="margin-top: 8px">On a keyboard: Tab moves between plates, and Space shares one ticket.</p>
    </aside>
  </div>
</div>
<template id="item"><!--kit:item-ticket--></template>
<template id="check"><!--kit:icon-check--></template>
<button class="ns-btn theme-switch" onclick="document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark'">Light / dark</button>
<script>
  // Reference behaviour only (v1 rules): deal one at a time, Undo, auto-check when nothing is left.
  const N = 15, K = 3;
  const state = { plates: [1, 1, 1], hist: [0, 1, 2] };
  const item = () => document.getElementById('item').content.firstElementChild.cloneNode(true);
  const check = () => document.getElementById('check').content.firstElementChild.cloneNode(true);
  const platesEl = document.getElementById('plates');
  const buttons = [];
  for (let i = 0; i < K; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'ns-plate-wrap';
    const b = document.createElement('button');
    b.className = 'ns-plate';
    b.addEventListener('click', () => {
      const used = state.plates.reduce((a, c) => a + c, 0);
      if (used >= N) return;
      state.plates[i]++; state.hist.push(i); render();
    });
    wrap.append(b, document.createTextNode('Plate ' + (i + 1)));
    platesEl.append(wrap);
    buttons.push(b);
  }
  document.getElementById('undo').addEventListener('click', () => {
    if (!state.hist.length) return;
    state.plates[state.hist.pop()]--; render();
  });
  function render() {
    const used = state.plates.reduce((a, c) => a + c, 0), left = N - used;
    const done = left === 0, equal = state.plates.every(c => c === state.plates[0]), solved = done && equal;
    document.getElementById('left').innerHTML = left ? 'Left to share: <b>' + left + '</b>' : 'All shared';
    const pool = document.getElementById('pool'); pool.replaceChildren(...Array.from({ length: left }, item));
    buttons.forEach((b, i) => {
      b.replaceChildren(...Array.from({ length: state.plates[i] }, item));
      b.disabled = done;
      b.setAttribute('aria-label', 'Plate ' + (i + 1) + ', has ' + state.plates[i]);
    });
    const strip = document.getElementById('strip');
    strip.setAttribute('aria-label', '15 divided by 3 equals ' + (solved ? '5' : 'unknown'));
    strip.innerHTML = '<span>15</span><span>÷</span><span>3</span><span>=</span>';
    const slot = document.createElement('span');
    slot.className = 'ns-slot' + (solved ? ' ns-slot--good' : '');
    slot.textContent = solved ? '5' : '?';
    if (solved) slot.append(check());
    strip.append(slot);
    const st = document.getElementById('status');
    st.className = solved ? 'ns-status' : done ? 'ns-nudge' : '';
    st.replaceChildren();
    if (solved) { st.append(check()); st.append(Object.assign(document.createElement('span'), { textContent: '15 shared into 3 equal groups is 5 in each group. You dealt them one at a time.' })); }
    else if (done) st.textContent = "The plates aren't equal yet. Undo to move some back, then share again.";
    document.getElementById('undo').disabled = state.hist.length === 0;
  }
  render();
</script>
</body>
</html>
