<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{
  /* Number Sky: math practice as a star chart. Every skill is a star; mastering it lights the star.
     Layout: one centred column (max 760px). Practice = one large question card, answers under it, feedback card below. */
  --bg:#EEF1F9;
  --surface:#FFFFFF;
  --surface-2:#E3E8F5;
  --ink:#19203F;
  --ink-soft:#4D5679;
  --line:#C9D0E6;
  --sky:#3A55C4;
  --accent:#E59A0B;
  --accent-ink:#2E1D00;
  --accent-soft:#FBEBC5;
  --good:#167F63;
  --good-soft:#D5F0E6;
  --warm:#B8532E;
  --warm-soft:#FAE2D7;
  --blk:#86A0F4;
  --blk-line:#2F4AB0;
  --shadow:0 1px 2px rgba(25,32,63,.06),0 6px 20px rgba(25,32,63,.07);
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1330;--surface:#171F47;--surface-2:#212B5B;--ink:#EEF0FA;--ink-soft:#AAB2D6;--line:#2E3A73;--sky:#93A6FF;
    --accent:#F7B932;--accent-ink:#2A1B00;--accent-soft:#3B3218;
    --good:#52D3A6;--good-soft:#163E35;--warm:#FF9C7B;--warm-soft:#46271F;
    --blk:#5671DE;--blk-line:#C3CEFF;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1330;--surface:#171F47;--surface-2:#212B5B;--ink:#EEF0FA;--ink-soft:#AAB2D6;--line:#2E3A73;--sky:#93A6FF;
  --accent:#F7B932;--accent-ink:#2A1B00;--accent-soft:#3B3218;
  --good:#52D3A6;--good-soft:#163E35;--warm:#FF9C7B;--warm-soft:#46271F;
  --blk:#5671DE;--blk-line:#C3CEFF;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(1.85rem,6vw,2.5rem);font-weight:800;letter-spacing:-.015em}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--ink-soft)}
.small{font-size:.88rem}
.center{text-align:center}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.1rem;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .08s ease,box-shadow .08s ease;text-align:center;line-height:1.2}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.big{width:100%;min-height:62px;font-size:1.2rem}
.btn.secondary{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink-soft);border:2px dashed var(--line);box-shadow:none;min-height:48px;font-size:1rem;padding:0 16px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:22px;height:22px}
.iconbtn{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.iconbtn:disabled{opacity:.4;cursor:default}
.iconbtn svg{width:24px;height:24px}
.ic{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.btn{flex:1 1 200px}

/* top bar */
.top{display:flex;align-items:center;gap:12px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;font-size:30px;flex:none;line-height:1}
.hello{flex:1;min-width:0}
.hello .hi{font-family:var(--font-display);font-weight:800;font-size:1.35rem;line-height:1.1;overflow-wrap:anywhere}
.hello .sub{color:var(--ink-soft);font-size:.95rem}
.gems{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 14px 6px 10px;box-shadow:var(--shadow);font-weight:700;font-size:1.1rem}
.gem{width:22px;height:22px;flex:none}
.gem .g1{fill:var(--accent)}
.gem .g2{fill:none;stroke:var(--accent-ink);stroke-opacity:.4;stroke-width:1.3}

/* hero */
.hero{position:relative;overflow:hidden;padding:24px 20px 20px}
.hero>*{position:relative}
.hero-sky{position:absolute!important;inset:0;pointer-events:none;opacity:.9;
  background:
    radial-gradient(circle at 86% 18%,var(--accent) 0 2.5px,transparent 3.5px),
    radial-gradient(circle at 74% 34%,var(--accent) 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 93% 46%,var(--sky) 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 64% 12%,var(--sky) 0 1.2px,transparent 2.2px),
    radial-gradient(circle at 80% 62%,var(--accent) 0 1.2px,transparent 2.2px),
    radial-gradient(120% 90% at 100% 0%,var(--accent-soft),transparent 55%)}
.hero h1{font-size:clamp(2rem,7vw,2.8rem)}
.hero-note{color:var(--ink-soft);max-width:44ch}
.stage{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.95rem;background:var(--surface-2);border-radius:999px;padding:4px 12px 4px 10px;align-self:flex-start}
.stage i{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);display:inline-block}
.stage i.on{background:var(--accent)}
.week{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.week .wl{color:var(--ink-soft);font-size:.9rem;margin-right:4px}
.week .wd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--ink-soft)}
.week .wd i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.week .wd.on i{background:var(--good);border-color:var(--good)}
.week .wd.today{color:var(--ink);font-weight:700}

/* star chart */
.sec-head{display:flex;flex-direction:column;gap:2px}
.chart{display:flex;flex-direction:column;gap:14px}
.const{background:var(--surface);border-radius:var(--r);padding:14px 14px 10px;box-shadow:var(--shadow)}
.const h3{font-size:.9rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.stars{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.star{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 8px;border-radius:14px;border:0;background:transparent;cursor:pointer;text-align:center}
.star:hover{background:var(--surface-2)}
.star .st{width:48px;height:48px;overflow:visible}
.star .sp{stroke-linejoin:round}
.star.lit .sp{fill:var(--accent);stroke:var(--accent);stroke-width:2}
.star.lit .glow{fill:var(--accent-soft)}
.star.now .sp{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.6}
.star.open .sp{fill:none;stroke:var(--accent);stroke-width:2.2}
.star.locked .sp{fill:var(--surface-2);stroke:var(--line);stroke-width:1.6}
.star.locked .sname{color:var(--ink-soft)}
.sname{font-size:.88rem;font-weight:700;line-height:1.2}
.pips{display:flex;gap:4px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line)}
.pips i.on{background:var(--accent);border-color:var(--accent)}
.nowtag{position:absolute;top:4px;right:8px;font-size:.68rem;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.star.now .st{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.home-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hold{position:relative;overflow:hidden;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.holdbar{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--accent)}
.hold.holding .holdbar{width:100%;transition:width 1.2s linear}

/* practice */
.ptop{display:flex;align-items:center;gap:12px}
.prog{flex:1;display:flex;gap:4px}
.prog i{flex:1;height:10px;border-radius:999px;background:var(--surface-2)}
.prog i.done{background:var(--accent)}
.prog i.cur{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.prog-text{flex:1;font-weight:700;color:var(--ink-soft)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.chip.rev{border-style:dashed}
.chip.good{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.chip.acc{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.qcard{gap:18px}
.qhead{display:flex;gap:12px;align-items:flex-start}
.prompt{flex:1;font-size:clamp(1.2rem,4.4vw,1.5rem);line-height:1.45}
.prompt.sm{font-size:clamp(1.1rem,4vw,1.3rem)}
.prompt b{font-weight:700;color:var(--ink)}
.eq{display:block;text-align:center;font-size:clamp(2rem,9vw,2.8rem);font-weight:700;letter-spacing:.02em;padding:6px 0;line-height:1.2}
.blank{display:inline-block;min-width:1.4em;border-bottom:4px solid var(--accent);color:var(--ink-soft);text-align:center}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;font-weight:700;margin:0 .1em}
.frac>span:first-child{border-bottom:3px solid currentColor;padding:0 .2em .08em}
.frac>span:last-child{padding-top:.1em}
.visual{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;overflow-x:auto;padding:4px 0}
.visual svg{max-width:100%;height:auto}
.cap{width:100%;text-align:center;font-weight:700;color:var(--ink-soft);font-size:.95rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.opt{min-height:72px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:1.7rem;font-weight:700;cursor:pointer;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:10px;line-height:1.25}
.opt.mid{font-size:1.3rem}
.opt.txt{font-size:1.05rem;justify-content:flex-start;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--warm-soft);border-color:var(--warm)}
.opt.sel{border-color:var(--sky)}
.opt .opi{flex:none}
.helpers{display:flex;gap:10px;flex-wrap:wrap}
.hint{background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.padshow{min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--surface-2);font-size:2rem;font-weight:700;display:flex;align-items:center;justify-content:center;max-width:360px;width:100%;margin:0 auto}
.padshow .ph{font-size:1rem;font-weight:400;color:var(--ink-soft)}
.padshow.right{background:var(--good-soft);border-color:var(--good)}
.padshow.wrong{background:var(--warm-soft);border-color:var(--warm)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;width:100%;margin:0 auto}
.key{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.7rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.key.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.15rem}
.key svg{width:28px;height:28px}
.key:disabled{opacity:.45;cursor:default}

/* feedback */
.fb{border:3px solid var(--line)}
.fb.good{border-color:var(--good);background:var(--good-soft)}
.fb.warm{border-color:var(--warm);background:var(--warm-soft)}
.fb .visual{background:var(--surface);border-radius:14px;padding:12px}
.buddy{display:flex;align-items:center;gap:12px}
.bubble{background:var(--surface);border-radius:16px;padding:10px 16px;font-weight:700;font-size:1.2rem;position:relative}
.fb-gems{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ans{font-size:1.15rem}

/* visuals */
.tfwrap{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tf{width:240px;max-width:100%;height:auto}
.tf-frame{fill:var(--surface-2);stroke:var(--ink-soft);stroke-width:2}
.tf-cell{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.tf-on{fill:var(--accent)}
.tf-pre{fill:var(--sky)}
.tf-tap{cursor:pointer}
.tf-tap:hover .tf-cell{stroke:var(--accent);stroke-width:2.5}
.blocks{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;justify-content:center;min-height:40px}
.bg{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap}
.bg.ones{display:grid;grid-template-columns:repeat(5,12px);gap:4px}
.flat{width:84px;height:84px}
.rod{width:12px;height:84px}
.cube{width:12px;height:12px}
.b-fill{fill:var(--blk)}
.b-line{fill:none;stroke:var(--blk-line);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.5}
.b-edge{fill:none;stroke:var(--blk-line);stroke-width:1.6;vector-effect:non-scaling-stroke}
.sum{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:center}
.sum .and{font-weight:700;color:var(--ink-soft);align-self:center}
.plates{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.pgrp{display:flex;flex-direction:column;align-items:center;gap:4px}
.plate{min-width:88px;min-height:88px;max-width:128px;padding:10px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);display:flex;flex-wrap:wrap;gap:2px;align-items:center;justify-content:center;align-content:center}
.plate.box{border-radius:14px}
.plate.tap{cursor:pointer;border-style:dashed;border-color:var(--accent)}
.plate.tap:disabled{cursor:default;border-style:solid;border-color:var(--line)}
.plabel{font-size:.8rem;color:var(--ink-soft);font-weight:700}
.it{font-size:22px;line-height:1.1}
.items{display:grid;grid-template-columns:repeat(5,40px);gap:6px;justify-content:center}
.it-c{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:10px;position:relative;line-height:1;border:0;background:transparent;padding:0}
.items.tap .it-c{background:var(--surface-2);cursor:pointer}
.items.tap .it-c:disabled{cursor:default}
.it-c.x{opacity:.4}
.it-c.x::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:4px;margin-top:-2px;background:var(--warm);border-radius:2px;transform:rotate(-38deg)}
.items.new .it-c{background:var(--accent-soft)}
.story{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.story-then{font-weight:700;color:var(--ink-soft)}
.arr{max-width:100%;height:auto}
.arr .d0{fill:var(--sky)}
.arr .d1{fill:var(--accent)}
.arr .d2{fill:var(--good)}
.arr .d-off{fill:none;stroke:var(--ink-soft);stroke-width:1.5;stroke-dasharray:3 3}
.rows{display:flex;flex-direction:column;gap:6px;align-items:center}
.rows .row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.rows .dots{display:flex;gap:5px}
.rows .dots i{width:18px;height:18px;border-radius:50%;background:var(--sky);display:block}
.rows .sk{font-weight:700;min-width:2.5em;color:var(--ink-soft)}
.nl{width:100%;max-width:560px;height:auto}
.nl-tap{cursor:pointer}
.nl-axis{stroke:var(--ink);stroke-width:3}
.nl-tick{stroke:var(--ink);stroke-width:2}
.nl-tick.big{stroke-width:3}
.nl-lab{fill:var(--ink);font-size:22px;text-anchor:middle;font-family:var(--font-body);font-weight:700}
.nl-jump{fill:none;stroke:var(--accent);stroke-width:3}
.nl-jlab{fill:var(--ink);font-size:17px;text-anchor:middle;font-family:var(--font-body);font-weight:700}
.nl-arrow{fill:var(--warm)}
.nl-marker{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.fb .nl-marker{stroke:var(--surface)}
.fbar,.fb-svg{}
.fbsvg{width:320px;max-width:100%;height:auto}
.fb-part{fill:var(--surface);stroke:var(--ink-soft);stroke-width:2}
.fb-part.on{fill:var(--accent)}
.fb-part.tap{cursor:pointer}
.fcsvg{width:150px;height:150px}
.bm{width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px}
.bm-whole{background:var(--sky);color:#fff;border-radius:10px;padding:10px;text-align:center;font-weight:700;font-size:1.3rem}
.bm-parts{display:flex;gap:6px}
.bm-part{background:var(--accent-soft);border:2px solid var(--accent);border-radius:10px;padding:10px 4px;text-align:center;font-weight:700;font-size:1.3rem;min-width:44px}
.bm-part.unk{background:var(--surface);border-style:dashed}
.tri{width:220px;height:auto}
.tri-edge{fill:var(--surface-2);stroke:var(--line);stroke-width:3;stroke-linejoin:round}
.tri-node{fill:var(--surface);stroke:var(--sky);stroke-width:3}
.tri-node.top{stroke:var(--accent)}
.tri-t{font-size:26px;font-weight:700;text-anchor:middle;fill:var(--ink);font-family:var(--font-body)}
.tri-op{font-size:22px;text-anchor:middle;fill:var(--ink-soft);font-family:var(--font-body);font-weight:700}
.pv{border-collapse:collapse;font-size:1.1rem}
.pv th{font-size:.85rem;color:var(--ink-soft);padding:4px 14px;border-bottom:2px solid var(--line)}
.pv td{font-size:2rem;font-weight:700;text-align:center;padding:4px 14px}
.pv td.hi{background:var(--accent-soft);border-radius:10px}
.opi{width:96px;height:44px}
.opi circle{fill:var(--sky)}
.opi .b{fill:var(--accent)}
.opi .ln{stroke:var(--ink-soft);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.opi rect{fill:none;stroke:var(--ink-soft);stroke-width:2}

/* build widgets */
.build{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.build>.visual,.build>.tfwrap,.build>.blocks,.build>.plates,.build>.rows,.build>.items{align-self:center}
.brow{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.steppers{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stepper{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:16px;padding:6px 8px}
.sl{font-weight:700;padding:0 6px;font-size:.95rem}
.sbtn{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1.6rem;font-weight:700;cursor:pointer;line-height:1}
.sbtn:disabled{opacity:.4;cursor:default}
.sv{min-width:1.6em;text-align:center;font-size:1.5rem;font-weight:700}
.nudge{background:var(--warm-soft);border-radius:12px;padding:10px 14px;font-weight:700}
.pospill{align-self:center;background:var(--surface-2);border-radius:999px;padding:4px 16px}
.jlog{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pool{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.pool .items{grid-template-columns:repeat(auto-fill,40px);width:100%}
.follow{border-top:2px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}

/* modal + toast */
#layer{position:relative;z-index:40}
.scrim{position:fixed;inset:0;background:rgba(10,14,35,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal{max-width:460px;width:100%;max-height:calc(100% - 32px);overflow:auto}
.modal .big-star{width:96px;height:96px;align-self:center}
.modal .big-star .sp{fill:var(--accent);stroke:var(--accent);stroke-width:2}
.modal .big-star .glow{fill:var(--accent-soft)}
.modal h2{font-size:1.7rem;text-align:center}
.modal .mbody{text-align:center;font-size:1.1rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:700;z-index:45;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.chartgrid{border-collapse:collapse;margin:0 auto;font-size:.95rem}
.chartgrid td,.chartgrid th{width:30px;height:30px;text-align:center;padding:0;border:1px solid var(--line)}
.chartgrid th{background:var(--surface-2);font-weight:700}
.chartgrid td{cursor:pointer}
.chartgrid td.hl{background:var(--accent-soft)}
.chartgrid td.hx{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chartwrap{overflow-x:auto}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.form label,.form legend{font-weight:700}
.form input,.form textarea,textarea.code{width:100%;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:12px 14px;font-size:1.15rem}
textarea.code{font-size:.8rem;font-family:ui-monospace,Menlo,monospace;min-height:90px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.avs{display:flex;gap:10px;flex-wrap:wrap}
.av{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:var(--surface);font-size:34px;cursor:pointer;line-height:1;padding:0}
.av.on{border-color:var(--accent);background:var(--accent-soft)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:1.2rem}
.brand svg{width:36px;height:36px}
.brand .sp{fill:var(--accent);stroke:var(--accent)}
.brand .glow{fill:var(--accent-soft)}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:700}
.item.using{border-color:var(--accent);background:var(--accent-soft)}
.item .emo{font-size:40px;line-height:1}
.item .sw{width:44px;height:44px;border-radius:50%}
.item .price{display:inline-flex;align-items:center;gap:4px;font-size:.95rem}
.item .price .gem{width:18px;height:18px}

/* summary */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div,.glance div{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center}
.stats b,.glance b{font-family:var(--font-display);font-size:1.9rem;line-height:1.1}
.stats span,.glance span{color:var(--ink-soft);font-size:.9rem}
.wins{display:flex;flex-direction:column;gap:8px}
.wins li{display:flex;gap:10px;align-items:center;font-weight:700}
.wins svg{width:28px;height:28px;flex:none}
.wins .sp{fill:var(--accent);stroke:var(--accent)}

/* grown-ups */
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.skl{display:flex;flex-direction:column;gap:14px}
.sr{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:0;padding-bottom:0}
.sr-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.sr-meta{font-size:.9rem}
.mis{display:flex;flex-direction:column;gap:14px}
.mis li{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.mis-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.try{font-weight:700}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0}
.set-l{font-weight:700}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-weight:700;cursor:pointer;min-height:44px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.how{display:flex;flex-direction:column;gap:8px;padding-left:1.1em!important;list-style:disc!important}
.sess{display:flex;flex-direction:column;gap:6px}
.sess li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0;flex-wrap:wrap}
.learners{display:flex;flex-direction:column;gap:8px}
.learners li{display:flex;align-items:center;gap:10px}
.learners .lname{flex:1;font-weight:700}
.boot{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.boot svg{width:64px;height:64px}
.boot .sp{fill:var(--accent);stroke:var(--accent)}
.boot .glow{fill:var(--accent-soft)}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;display:none}

@media (max-width:420px){
  .card{padding:16px}
  .opts{grid-template-columns:1fr 1fr}
  .opts.one{grid-template-columns:1fr}
  .stats b,.glance b{font-size:1.5rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<body>
<main class="wrap" id="app" aria-live="off"></main>
<div id="layer"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script id="engine">
// ================= ENGINE: content, question generators, learning model (no DOM) =================
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const NAMES=['Maya','Leo','Ava','Sam','Noor','Eli','Zoe','Kai','Priya','Owen','Lucia','Ben'];
const ITEMS=[{one:'cookie',many:'cookies',e:'🍪'},{one:'apple',many:'apples',e:'🍎'},{one:'star',many:'stars',e:'⭐'},{one:'shell',many:'shells',e:'🐚'},{one:'strawberry',many:'strawberries',e:'🍓'},{one:'marble',many:'marbles',e:'🔵'},{one:'heart',many:'hearts',e:'💜'},{one:'leaf',many:'leaves',e:'🍀'}];
const STAGES=['Hands-on','Pictures','Numbers'];
const STAGE_WITH=['hands-on','pictures','just numbers'];

const SKILLS=[
 {id:'quantity',name:'Seeing amounts',group:'Number sense',pre:[],about:'Recognising amounts in ten-frames and comparing two-digit numbers.',kid:'Spot how many without counting one by one, and compare numbers.'},
 {id:'numberline',name:'Number line',group:'Number sense',pre:['quantity'],about:'Placing and reading numbers on a number line; 1 more/less and 10 more/less.',kid:'Find numbers on a number line.'},
 {id:'placevalue',name:'Tens and ones',group:'Number sense',pre:['quantity'],about:'Place value: building numbers from hundreds, tens and ones.',kid:'Build numbers out of hundreds, tens and ones.'},
 {id:'makes10',name:'Making 10',group:'Number sense',pre:['quantity'],about:'Number bonds to 10, 20 and 100.',kid:'Find the numbers that make 10, 20 and 100.'},
 {id:'addition',name:'Adding',group:'Add & subtract',pre:['numberline','placevalue','makes10'],about:'Addition as combining, using number-line jumps and tens and ones.',kid:'Put groups together and find the total.'},
 {id:'subtraction',name:'Taking away',group:'Add & subtract',pre:['addition'],about:'Subtraction as taking away and finding a missing part, including regrouping.',kid:'Take away and find what is left.'},
 {id:'multmeaning',name:'Equal groups',group:'Multiply',pre:['addition'],about:'What multiplication means: equal groups and arrays.',kid:'Multiplying means equal groups. Learn to see them.'},
 {id:'multeasy',name:'× 2, 5, 10',group:'Multiply',pre:['multmeaning'],about:'Facts for 2, 5 and 10 using doubling, half of ten and adding a zero.',kid:'Times 2, 5 and 10 with shortcuts.'},
 {id:'multmid',name:'× 3 and 4',group:'Multiply',pre:['multeasy'],about:'Facts for 3 and 4, built from ×2.',kid:'Times 3 and 4, built from times 2.'},
 {id:'multhard',name:'× 6 to 9',group:'Multiply',pre:['multmid'],about:'Facts for 6 to 9, built from ×5 and ×10.',kid:'Times 6 to 9, built from times 5 and 10.'},
 {id:'divmeaning',name:'Sharing equally',group:'Divide',pre:['multmeaning','subtraction'],about:'What division means: sharing into equal groups (and how it differs from taking away).',kid:'Dividing means sharing into equal groups.'},
 {id:'divfacts',name:'Division facts',group:'Divide',pre:['divmeaning','multeasy'],about:'Division as the reverse of multiplication (fact families).',kid:'Use times facts to divide.'},
 {id:'whichop',name:'Which operation?',group:'Problem solving',pre:['divmeaning','subtraction'],about:'Reading a word problem and choosing +, −, × or ÷ from what is happening in the story.',kid:'Read a story problem and pick +, −, × or ÷.'},
 {id:'fractions',name:'Fractions',group:'Problem solving',pre:['divmeaning'],about:'Fractions as equal parts of a whole, unit fractions, and a fraction of a number.',kid:'Equal parts of a whole.'},
];
const SK=Object.fromEntries(SKILLS.map(s=>[s.id,s]));
const GROUPS=['Number sense','Add & subtract','Multiply','Divide','Problem solving'];
const LADDER=['quantity','numberline','placevalue','makes10','addition','subtraction','multmeaning','multeasy','divmeaning','multmid','whichop','divfacts','fractions','multhard'];

const MIS={
 'op-sub-for-div':{kid:'That answer comes from taking away. Dividing means sharing into equal groups.',parent:'Used subtraction on a division question',act:'Deal real objects (cards, coins, crackers) into equal piles and say it out loud: "12 shared into 3 piles is 4 each."'},
 'op-add-for-div':{kid:'That answer adds the numbers. Dividing splits a number into equal groups.',parent:'Added on a division question',act:'Share objects into equal piles, then count one pile.'},
 'op-mult-for-div':{kid:'That answer multiplies. Dividing goes the other way: it splits into equal groups.',parent:'Multiplied on a division question',act:'Use a fact triangle (12 at the top, 3 and 4 at the bottom). Cover one number and ask what is missing.'},
 'op-add-for-mult':{kid:'That answer adds the two numbers. Multiplying means equal groups: 3 × 4 is 3 groups of 4.',parent:'Added instead of multiplying',act:'Make equal groups with objects, like 3 cups with 4 beans in each, and count them.'},
 'op-add-for-sub':{kid:'That answer adds. Taking away makes the number smaller.',parent:'Added on a subtraction question',act:'Act out take-away stories with objects she can physically remove.'},
 'op-sub-for-add':{kid:'That answer takes away. Adding puts groups together, so the total gets bigger.',parent:'Subtracted on an addition question',act:'Push two piles of objects together and count all of them.'},
 'sub-smaller-from-larger':{kid:'Careful: in each column, take the bottom number away from the top one. If the top is smaller, break a ten into 10 ones first.',parent:'Took the smaller digit from the larger one in each column (regrouping error)',act:'Use bundled straws or base-ten blocks and physically trade one ten for ten ones.'},
 'regroup':{kid:'That answer is 10 away. Check whether a ten needs to move.',parent:'Off by exactly ten (carrying or borrowing slip)',act:'Add and subtract with base-ten blocks, making a new ten whenever there are 10 ones.'},
 'place-swap':{kid:'The digits are swapped. The first digit tells you the tens.',parent:'Reversed the digits (for example 47 and 74)',act:'Build numbers with blocks, or $10 bills and $1 coins, and say them as "4 tens and 7 ones".'},
 'place-face':{kid:'Look at where the digit sits. A 4 in the tens place is worth 40.',parent:'Gave the digit instead of its place value',act:'Use a hundreds | tens | ones chart, or money: $100, $10 and $1.'},
 'tens-ones-mix':{kid:'Check which digit changes: 1 more or less changes the ones, and 10 more or less changes the tens.',parent:'Mixed up 1 more/less with 10 more/less',act:'Use a hundred chart: 1 more is one step right, 10 more is one row down.'},
 'off-by-one':{kid:'So close! That is one away. Count again slowly and touch each one.',parent:'Off by one (counting slip)',act:'Count objects by touching and moving each one; group them in fives and tens.'},
 'fact-neighbor':{kid:'Close: that is one group too many or too few. Build it from a fact you know.',parent:'Gave a neighbouring times-table answer',act:'Practise one strategy at a time, for example ×9 is ×10 minus one group.'},
 'skip-count':{kid:'Count the groups again. Each group adds the same amount.',parent:'Skip-counting slip',act:'Skip-count out loud while pointing at each group.'},
 'make10-same':{kid:'That repeats the number you started with. Count the empty spaces instead.',parent:'Repeated the given number instead of finding the missing part',act:'Use an egg carton or ten-frame: how many empty spots are left?'},
 'numberline-scale':{kid:'Check what each tick counts by. Here each tick might be worth 10.',parent:'Misread the scale on a number line',act:'Tape a number line on the floor and walk it, counting by ones and then by tens.'},
 'frac-denominator':{kid:'More pieces means smaller pieces. 1/8 is smaller than 1/4.',parent:'Thought a bigger bottom number means a bigger fraction',act:'Fold paper strips into halves, quarters and eighths and compare the pieces.'},
 'frac-flip':{kid:'The bottom number is how many equal parts. The top number is how many are shaded.',parent:'Swapped the top and bottom numbers of a fraction',act:'Shade parts of paper strips and name them: "3 out of 4 parts".'},
 'frac-part-part':{kid:'The bottom number counts all the parts, shaded and not shaded.',parent:'Compared shaded parts to unshaded parts instead of to the whole',act:'Always count the whole first, then the shaded parts.'},
 'frac-unshaded':{kid:'That counts the parts that are not shaded. Count the shaded ones.',parent:'Counted the unshaded parts',act:'Point to and count only the coloured parts.'},
 'story-op':{kid:'Picture the story. Are things joined, taken away, put in equal groups, or shared?',parent:'Chose the wrong operation in a word problem',act:'Act out word problems with objects before writing any numbers.'},
};

// ---------- small helpers ----------
function Q(o){return Object.assign({visual:null,hint:null,explain:{text:''},say:null},o);}
function fr(k,n){return `<span class="frac" aria-label="${k} out of ${n}"><span>${k}</span><span>${n}</span></span>`;}
function eq(left,right){return `<span class="eq">${left} = ${right===undefined?'<span class="blank">?</span>':right}</span>`;}
function skip(step,count){const a=[];for(let i=1;i<=count;i++)a.push(step*i);return a.join(', ');}
function plural(n,one,many){return n===1?one:(many||one+'s');}
function numOpts(correct,ds=[],{min=0,n=4}={}){
  const out=[{value:correct,label:String(correct),mis:null}],seen=new Set([correct]);
  for(const d of ds){if(!d)continue;const v=d.v;if(!Number.isInteger(v)||v<min||seen.has(v))continue;seen.add(v);out.push({value:v,label:String(v),mis:d.mis||null});if(out.length>=n)break;}
  let step=1;while(out.length<3&&step<60){for(const v of [correct+step,correct-step]){if(out.length<3&&v>=min&&!seen.has(v)){seen.add(v);out.push({value:v,label:String(v),mis:step===1?'off-by-one':null});}}step++;}
  return {options:shuffle(out),answer:correct};
}
function pm(pairs,ans){const m={};for(const [v,mis] of pairs){if(Number.isInteger(v)&&v>=0&&v!==ans&&!(v in m))m[v]=mis;}return m;}
function jumpList(a,b,useTens,dir=1){const js=[];let p=a;const t=useTens?Math.floor(b/10):0,o=useTens?b%10:b;for(let i=0;i<t;i++){js.push({from:p,to:p+10*dir,label:(dir>0?'+':'−')+'10'});p+=10*dir;}for(let i=0;i<o;i++){js.push({from:p,to:p+dir,label:(dir>0?'+':'−')+'1'});p+=dir;}return js;}
function tensLabels(lo,hi){const l=[];for(let v=lo;v<=hi;v+=10)l.push(v);return l;}
function rangeFor(a,b){const lo=Math.floor(Math.min(a,b)/10)*10;let hi=Math.ceil(Math.max(a,b)/10)*10;if(hi===lo)hi+=10;return [lo,hi];}

// ---------- visuals (return HTML/SVG strings) ----------
function vTF(cells,tapBase=null){
  const cs=40,g=5,w=5*cs+6*g,h=2*cs+3*g;
  let s=`<svg class="tf" viewBox="0 0 ${w} ${h}" aria-hidden="true"><rect x="1.5" y="1.5" width="${w-3}" height="${h-3}" rx="10" class="tf-frame"/>`;
  for(let i=0;i<10;i++){const r=Math.floor(i/5),c=i%5,x=g+c*(cs+g),y=g+r*(cs+g),st=cells[i];const tap=tapBase!==null&&st!==2;
    s+=`<g${tap?` data-act="cell" data-i="${tapBase+i}" class="tf-tap"`:''}><rect x="${x}" y="${y}" width="${cs}" height="${cs}" rx="7" class="tf-cell"/>`;
    if(st)s+=`<circle cx="${x+cs/2}" cy="${y+cs/2}" r="13" class="${st===2?'tf-pre':'tf-on'}"/>`;
    s+='</g>';}
  return s+'</svg>';
}
function vFrames(n,frames=null,preset=0){
  frames=frames||Math.max(1,Math.ceil(n/10));
  let out=`<div class="tfwrap" role="img" aria-label="${n} dots in ten-frames">`;
  for(let f=0;f<frames;f++){const cells=[];for(let i=0;i<10;i++){const idx=f*10+i;cells.push(idx<preset?2:(idx<n?1:0));}out+=vTF(cells);}
  return out+'</div>';
}
const FLAT=(()=>{let d='';for(let i=1;i<10;i++)d+=`M${i*10} 0V100M0 ${i*10}H100`;return `<svg class="flat" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" class="b-fill"/><path d="${d}" class="b-line"/><rect width="100" height="100" class="b-edge"/></svg>`;})();
const ROD=(()=>{let d='';for(let i=1;i<10;i++)d+=`M0 ${i*10}H10`;return `<svg class="rod" viewBox="0 0 10 100" aria-hidden="true"><rect width="10" height="100" class="b-fill"/><path d="${d}" class="b-line"/><rect width="10" height="100" class="b-edge"/></svg>`;})();
const CUBE=`<svg class="cube" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" class="b-fill"/><rect width="10" height="10" class="b-edge"/></svg>`;
function vBlocks(h,t,o){
  const parts=[];if(h)parts.push(`${h} ${plural(h,'hundred')}`);parts.push(`${t} ${plural(t,'ten')}`);parts.push(`${o} ${plural(o,'one')}`);
  let s=`<div class="blocks" role="img" aria-label="${parts.join(', ')}">`;
  if(h)s+=`<div class="bg">${FLAT.repeat(h)}</div>`;
  if(t)s+=`<div class="bg">${ROD.repeat(t)}</div>`;
  if(o)s+=`<div class="bg ones">${CUBE.repeat(o)}</div>`;
  if(!h&&!t&&!o)s+=`<p class="muted">No blocks yet</p>`;
  return s+'</div>';
}
function vSum(a,b){return `<div class="sum">${vBlocks(Math.floor(a/100),Math.floor(a/10)%10,a%10)}<span class="and">and</span>${vBlocks(Math.floor(b/100),Math.floor(b/10)%10,b%10)}</div>`;}
function vPlates(groups,each,e,{label=null,box=false}={}){
  let s=`<div class="plates" role="img" aria-label="${groups} groups with ${each} in each">`;
  for(let g=0;g<groups;g++)s+=`<div class="pgrp"><div class="plate${box?' box':''}">${`<span class="it">${e}</span>`.repeat(each)}</div>${label?`<div class="plabel">${label} ${g+1}</div>`:''}</div>`;
  return s+'</div>';
}
function vItems(n,e,crossed=0,cls=''){
  let s=`<div class="items ${cls}" role="img" aria-label="${n} items${crossed?`, ${crossed} taken away`:''}">`;
  for(let i=0;i<n;i++)s+=`<span class="it-c${i>=n-crossed?' x':''}">${e}</span>`;
  return s+'</div>';
}
function vArray(rows,cols,{parts=null,removed=0}={}){
  const sp=24,r=8.5,pad=6,w=cols*sp+pad*2,h=rows*sp+pad*2;const rc=[];
  if(parts){let i=0;parts.forEach((c,pi)=>{for(let k=0;k<c;k++)rc[i++]=pi;});}
  let s=`<svg class="arr" viewBox="0 0 ${w} ${h}" style="width:${Math.min(Math.round(w*1.25),340)}px" role="img" aria-label="${rows} rows of ${cols}${removed?`, last ${removed} row crossed out`:''}">`;
  for(let y=0;y<rows;y++){const off=y>=rows-removed;for(let x=0;x<cols;x++)s+=`<circle cx="${pad+sp/2+x*sp}" cy="${pad+sp/2+y*sp}" r="${r}" class="${off?'d-off':'d'+((rc[y]||0)%3)}"/>`;}
  return s+'</svg>';
}
const NL={W:480,L:24,R:456};
function vLine({min,max,tick=1,labels=null,arrow=null,marker=null,jumps=[],tap=false}){
  const {W,L,R}=NL,H=112,y=64,X=v=>L+(v-min)/(max-min)*(R-L);
  let s=`<svg class="nl${tap?' nl-tap':''}"${tap?' data-act="nltap"':''} viewBox="0 0 ${W} ${H}" role="img" aria-label="number line from ${min} to ${max}${marker!==null?`, dot at ${marker}`:''}">`;
  s+=`<line x1="${L}" y1="${y}" x2="${R}" y2="${y}" class="nl-axis"/>`;
  const n=Math.round((max-min)/tick);
  for(let i=0;i<=n;i++){const v=min+i*tick,lab=labels?labels.includes(v):true,x=X(v).toFixed(1);
    s+=`<line x1="${x}" y1="${y-(lab?13:8)}" x2="${x}" y2="${y+(lab?13:8)}" class="nl-tick${lab?' big':''}"/>`;
    if(lab)s+=`<text x="${x}" y="${y+38}" class="nl-lab">${v}</text>`;}
  const showAll=jumps.length<=6;
  jumps.forEach(j=>{const x1=X(j.from),x2=X(j.to),mid=(x1+x2)/2,hg=Math.min(36,8+Math.abs(x2-x1)*.3);
    s+=`<path d="M${x1.toFixed(1)} ${y-3} Q${mid.toFixed(1)} ${(y-3-hg*2).toFixed(1)} ${x2.toFixed(1)} ${y-3}" class="nl-jump"/>`;
    if(j.label&&(showAll||Math.abs(j.to-j.from)>=10))s+=`<text x="${mid.toFixed(1)}" y="${(y-9-hg).toFixed(1)}" class="nl-jlab">${j.label}</text>`;});
  if(arrow!==null)s+=`<path d="M${X(arrow).toFixed(1)} ${y-5} l-10 -20 h20 z" class="nl-arrow"/>`;
  if(marker!==null)s+=`<circle cx="${X(marker).toFixed(1)}" cy="${y}" r="10" class="nl-marker"/>`;
  return s+'</svg>';

function story(type,small){
  const N=pick(NAMES),it=pick(ITEMS);let a,b,ans,op,text;
  if(type==='join'){a=ri(small?3:14,small?9:48);b=ri(small?2:6,small?6:27);ans=a+b;op='+';text=`${N} has ${a} ${it.many}. ${N} gets ${b} more. How many ${it.many} does ${N} have now?`;}

  else if(type==='groups'){a=ri(2,small?4:9);b=ri(2,small?4:9);ans=a*b;op='×';text=`There are ${a} bags. Each bag has ${b} ${it.many}. How many ${it.many} are there altogether?`;}
  else if(type==='share'){b=ri(2,small?3:6);ans=ri(2,small?4:9);a=b*ans;op='÷';text=`${N} shares ${a} ${it.many} equally between ${b} friends. How many ${it.many} does each friend get?`;}
  else {b=ri(2,small?4:6);ans=ri(2,small?4:8);a=b*ans;op='÷';text=`${a} ${it.many} are packed into boxes, with ${b} in each box. How many boxes are filled?`;}
  return {type,N,it,a,b,ans,op,text};
}

  if(s.type==='separate')return vItems(s.a,e,s.b);

function makeQuestion(skill,stage,easy){const q=GEN[skill][stage](easy);q.skill=skill;q.stage=stage;return q;}

// ---------- learning model (Bayesian Knowledge Tracing per skill and level) ----------
const BKT={T:0.12,S:0.1};
function newSkillState(){return {stage:0,best:0,mastered:false,pL:[0.3,0.2,0.1],att:[0,0,0],cor:[0,0,0],recent:[[],[],[]],visit:[0,0,0],lastSeen:0,masteredAt:0};}
function newProfile(name,avatar){const skills={};SKILLS.forEach(s=>skills[s.id]=newSkillState());
  return {id:'p'+Date.now().toString(36)+Math.floor(Math.random()*1000),name,avatar,created:Date.now(),placementDone:false,skills,focus:null,mis:{},gems:10,
    owned:{avatars:[avatar],themes:['marigold']},theme:'marigold',days:[],sessions:[],log:[],settings:{sessionLen:10,sound:true,autoRead:false,chart:true}};}
function bkt(p,ok,G){const S=BKT.S;const post=ok?p*(1-S)/(p*(1-S)+(1-p)*G):p*S/(p*S+(1-p)*(1-G));return Math.min(0.995,Math.max(0.01,post+(1-post)*BKT.T));}
function guessFor(q){if(q.kind==='mc')return 1/q.options.length;if(q.kind==='pad')return 0.03;return 0.05;}
function frontier(p){return SKILLS.filter(s=>!p.skills[s.id].mastered&&s.pre.every(id=>p.skills[id].mastered));}
function pickFocus(p){const fr=frontier(p);if(p.focus&&fr.some(s=>s.id===p.focus))return p.focus;fr.sort((a,b)=>LADDER.indexOf(a.id)-LADDER.indexOf(b.id));p.focus=fr[0]?fr[0].id:null;return p.focus;}
function nextItem(p,sess){
  const mastered=SKILLS.filter(s=>p.skills[s.id].mastered),f=pickFocus(p);
  if(mastered.length&&(!f||sess.i%4===3)){mastered.sort((a,b)=>p.skills[a.id].lastSeen-p.skills[b.id].lastSeen);return {skill:mastered[0].id,stage:Math.random()<.7?2:1,review:true};}
  if(!f)return null;
  return {skill:f,stage:p.skills[f].stage,review:false};
}
function noteMis(p,mis){if(!mis)return;const m=p.mis[mis]||{count:0,last:0};m.count++;m.last=Date.now();p.mis[mis]=m;}
function record(p,skill,stage,ok,{hinted=false,mis=null,G=0.25,review=false,unsure=false}={}){
  const sk=p.skills[skill],ev=[],clean=ok&&!hinted;
  sk.pL[stage]=(ok&&hinted)?Math.min(0.995,sk.pL[stage]+(1-sk.pL[stage])*BKT.T*0.5):bkt(sk.pL[stage],ok,G);
  sk.att[stage]++;if(ok)sk.cor[stage]++;
  sk.recent[stage].push(clean?1:0);if(sk.recent[stage].length>5)sk.recent[stage].shift();
  sk.visit[stage]++;sk.lastSeen=Date.now();noteMis(p,mis);
  p.log.push({t:Date.now(),s:skill,g:stage,ok,h:hinted?1:0,m:mis,r:review?1:0,u:unsure?1:0});if(p.log.length>400)p.log.splice(0,p.log.length-400);
  if(review){if(sk.mastered&&sk.pL[stage]<0.4){sk.mastered=false;sk.stage=stage;sk.visit=[0,0,0];sk.recent=[[],[],[]];p.focus=skill;ev.push({type:'refresh',skill});}return ev;}
  const rec=sk.recent[stage],last3ok=rec.length>=3&&rec.slice(-3).every(x=>x===1);
  if(sk.pL[stage]>=0.9&&last3ok){
    if(stage<2){const back=(sk.best||0)>stage;sk.stage=stage+1;sk.best=Math.max(sk.best||0,sk.stage);sk.visit[sk.stage]=0;sk.recent[sk.stage]=[];ev.push({type:back?'back':'up',skill,stage:sk.stage});}
    else{sk.mastered=true;sk.masteredAt=Date.now();if(p.focus===skill)p.focus=null;ev.push({type:'mastered',skill});}
    return ev;
  }
  const last3=rec.slice(-3),wrong=last3.filter(x=>x===0).length;
  if(sk.visit[stage]>=3&&last3.length>=3&&wrong>=2&&sk.pL[stage]<0.4){
    if(stage>0){sk.stage=stage-1;sk.visit[sk.stage]=0;sk.recent[sk.stage]=[];sk.recent[stage]=[];ev.push({type:'down',skill,stage:sk.stage});}
    else{const pre=SK[skill].pre;
      if(pre.length){const w=pre.slice().sort((a,b)=>p.skills[a].pL[2]-p.skills[b].pL[2])[0],ws=p.skills[w];
        ws.mastered=false;ws.stage=1;ws.pL[1]=Math.min(ws.pL[1],0.6);ws.pL[2]=Math.min(ws.pL[2],0.5);ws.visit=[0,0,0];ws.recent=[[],[],[]];
        sk.visit[0]=0;sk.recent[0]=[];p.focus=w;ev.push({type:'prereq',skill,to:w});}
      else{sk.visit[0]=0;sk.recent[0]=[];}}
  }
  return ev;
}
// placement: binary search along the ladder, two number-level questions per probe
function placementInit(){return {lo:0,hi:LADDER.length-1,mid:null,asked:0,firstOk:null,tested:{}};}
function placementNext(P){if(P.lo>P.hi||P.asked>=12)return null;if(P.mid===null)P.mid=Math.floor((P.lo+P.hi)/2);return {skill:LADDER[P.mid],stage:2};}
function placementRecord(P,ok){P.asked++;const id=LADDER[P.mid];
  if(P.firstOk===null){if(ok){P.firstOk=true;return;}P.tested[id]='fail';P.hi=P.mid-1;P.mid=null;P.firstOk=null;return;}
  if(ok){P.tested[id]='pass';P.lo=P.mid+1;}else{P.tested[id]='fail';P.hi=P.mid-1;}P.mid=null;P.firstOk=null;}
function placementApply(p,P){const start=P.lo;
  LADDER.forEach((id,i)=>{const s=newSkillState();if(i<start){s.mastered=true;s.stage=2;s.best=2;s.pL=[0.95,0.92,P.tested[id]==='pass'?0.92:0.88];s.masteredAt=Date.now();}p.skills[id]=s;});
  p.placementDone=true;p.focus=null;pickFocus(p);return start;}
</script>

function initBuild(bd){switch(bd.type){
  case 'tenframe':{const cells=Array(bd.frames*10).fill(0);for(let i=0;i<bd.preset;i++)cells[i]=2;return {cells};}
  case 'blocks':return {h:0,t:0,o:0};
  case 'nlplace':return {m:null};
  case 'jumps':{const lo=Math.floor(bd.start/10)*10;return {pos:bd.start,hist:[],lo,hi:Math.max(lo+20,Math.ceil((bd.target+1)/10)*10)};}
  case 'crossout':return {x:Array(bd.n).fill(false)};
  case 'groups':return {a:1,b:1};
  case 'rows':return {r:0};
  case 'share':return {plates:Array(bd.k).fill(0),hist:[]};
  case 'makegroups':return {g:0};
  case 'shade':return {s:Array(bd.n).fill(false)};}
  return {};}
function buildRight(bd,b){switch(bd.type){
  case 'tenframe':return b.cells.filter(Boolean).length===bd.target;
  case 'blocks':return b.h*100+b.t*10+b.o===bd.target;
  case 'nlplace':return b.m===bd.target;
  case 'jumps':return b.pos===bd.target;
  case 'crossout':return b.x.filter(Boolean).length===bd.k;
  case 'groups':return b.a===bd.a&&b.b===bd.b;
  case 'rows':return b.r===bd.target;
  case 'share':{const sum=b.plates.reduce((a,c)=>a+c,0);return sum===bd.n&&b.plates.every(c=>c===b.plates[0]);}
  case 'makegroups':return b.g*bd.k===bd.n;
  case 'shade':return b.s.filter(Boolean).length===bd.k;}
  return false;}
function buildNudge(bd,b){switch(bd.type){
  case 'tenframe':return `Not quite. Count your dots again. You need ${bd.target} in all.`;
  case 'blocks':return 'Not quite. Check the tens and the ones again.';
  case 'nlplace':return b.m===null?'Tap the line to place the dot first.':'Not quite. Find the nearest labelled number, then count the ticks.';
  case 'jumps':return b.pos<bd.target?'Not there yet. How many have you jumped so far?':'You went past it. Tap Undo and try again.';
  case 'crossout':return `You need to take away exactly ${bd.k}. Count the crossed-out ones.`;
  case 'groups':return `Check both numbers: ${bd.a} groups, with ${bd.b} in each group.`;
  case 'rows':return `You need ${bd.target} rows. Count the rows again.`;
  case 'share':return 'The plates aren\'t equal yet. Tap Undo to move some back, then share again.';
  case 'shade':return `Shade exactly ${bd.k} parts.`;}
  return 'Not quite. Try again.';}
const NEEDS_CHECK=['tenframe','blocks','nlplace','crossout','groups','rows','shade'];
function vBuild(){const q=Cur.q,bd=q.build,b=Cur.b,done=!!b.done||Cur.phase!=='answer',D=done?' disabled':'';let h='';
  switch(bd.type){
    case 'tenframe':h+='<div class="tfwrap">';for(let f=0;f<bd.frames;f++)h+=vTF(b.cells.slice(f*10,f*10+10),done?null:f*10);h+='</div>';break;
    case 'blocks':{h+=vBlocks(b.h,b.t,b.o);const places=[...(bd.hundreds?[['h','Hundreds','hundred',3]]:[]),['t','Tens','ten',9],['o','Ones','one',9]];
      h+=`<div class="steppers">${places.map(([k,l,one,mx])=>`<div class="stepper"><span class="sl">${l}</span><button class="sbtn" data-act="blk" data-d="${k}-" aria-label="Take away one ${one}"${done||b[k]<=0?' disabled':''}>−</button><span class="sv" aria-label="${b[k]} ${plural(b[k],one)}">${b[k]}</span><button class="sbtn" data-act="blk" data-d="${k}+" aria-label="Add one ${one}"${done||b[k]>=mx?' disabled':''}>+</button></div>`).join('')}</div>`;break;}
    case 'nlplace':h+=`<div class="visual">${vLine({min:bd.min,max:bd.max,labels:bd.labels,marker:b.m,tap:!done})}</div><div class="brow"><button class="iconbtn" data-act="nlnudge" data-d="-1" aria-label="Move the dot left"${D}>${ICON.left}</button><span class="muted">${b.m===null?'Tap the line':'Arrows move the dot'}</span><button class="iconbtn" data-act="nlnudge" data-d="1" aria-label="Move the dot right"${D}>${ICON.right}</button></div>`;break;
    case 'jumps':{const lab=bd.tens?tensLabels(b.lo,b.hi):[0,5,10,15,20].filter(v=>v>=b.lo&&v<=b.hi);
      h+=`<div class="pospill">You're on <b>${b.pos}</b></div><div class="visual">${vLine({min:b.lo,max:b.hi,labels:lab,marker:b.pos,jumps:b.hist.map(([f,t])=>({from:f,to:t,label:'+'+(t-f)}))})}</div>
<div class="jlog" aria-label="Jumps so far">${b.hist.length?b.hist.map(([f,t])=>`<span class="chip">+${t-f}</span>`).join(''):'<span class="muted">No jumps yet</span>'}</div>
<div class="brow">${bd.tens?`<button class="btn secondary" data-act="jump" data-d="10"${done||b.pos+10>b.hi?' disabled':''}>+10</button>`:''}<button class="btn secondary" data-act="jump" data-d="1"${done||b.pos+1>b.hi?' disabled':''}>+1</button><button class="btn ghost" data-act="jundo"${done||!b.hist.length?' disabled':''}>Undo</button></div>
${done?'':'<button class="btn big" data-act="jdone">I\'m there</button>'}`;break;}
    case 'crossout':h+=`<div class="items tap">${b.x.map((x,i)=>`<button class="it-c${x?' x':''}" data-act="cross" data-i="${i}" aria-pressed="${x}" aria-label="${i+1}${x?', taken away':''}"${D}>${bd.e}</button>`).join('')}</div><p class="muted center">Taken away: ${b.x.filter(Boolean).length}</p>`;break;
    case 'groups':h+=vPlates(b.a,b.b,bd.e)+`<div class="steppers">${[['a','Groups'],['b','In each group']].map(([k,l])=>`<div class="stepper"><span class="sl">${l}</span><button class="sbtn" data-act="grp" data-d="${k}-" aria-label="${l}: fewer"${done||b[k]<=1?' disabled':''}>−</button><span class="sv">${b[k]}</span><button class="sbtn" data-act="grp" data-d="${k}+" aria-label="${l}: more"${done||b[k]>=6?' disabled':''}>+</button></div>`).join('')}</div>`;break;
    case 'rows':h+=`<div class="rows" role="img" aria-label="${b.r} rows of ${bd.each}">${b.r?Array.from({length:b.r},(_,i)=>`<div class="row"><span class="dots">${'<i></i>'.repeat(bd.each)}</span><span class="sk">${(i+1)*bd.each}</span></div>`).join(''):'<p class="muted">No rows yet</p>'}</div>
<div class="brow"><button class="btn secondary" data-act="row" data-d="+"${done||b.r>=10?' disabled':''}>+ Add a row of ${bd.each}</button><button class="btn ghost" data-act="row" data-d="-"${done||b.r<=0?' disabled':''}>Remove a row</button></div>`;break;
    case 'share':{const left=bd.n-b.plates.reduce((a,c)=>a+c,0);
      h+=`<div class="pool"><div>Left to share: <b>${left}</b></div><div class="items">${`<span class="it-c">${bd.e}</span>`.repeat(left)||'<span class="muted">All shared</span>'}</div></div>
<div class="plates">${b.plates.map((c,i)=>`<div class="pgrp"><button class="plate tap" data-act="plate" data-i="${i}" aria-label="Plate ${i+1}, has ${c}"${done||left===0?' disabled':''}>${`<span class="it">${bd.e}</span>`.repeat(c)}</button><div class="plabel">Plate ${i+1}</div></div>`).join('')}</div>
<div class="brow"><button class="btn ghost" data-act="sundo"${done||!b.hist.length?' disabled':''}>Undo</button></div>`;break;}
    case 'makegroups':{const left=bd.n-b.g*bd.k;
      h+=`<div class="pool"><div>Left: <b>${left}</b></div><div class="items">${`<span class="it-c">${bd.e}</span>`.repeat(left)||'<span class="muted">None left</span>'}</div></div>
<button class="btn big" data-act="mkgrp"${done||left<bd.k?' disabled':''}>Make a group of ${bd.k}</button>${b.g?vPlates(b.g,bd.k,bd.e,{box:true,label:'Group'}):''}`;break;}
    case 'shade':h+=`<div class="visual">${vFracBar(bd.n,0,{shaded:b.s,tap:!done})}</div><p class="muted center">Shaded: ${b.s.filter(Boolean).length}</p>`;break;
  }
  if(!done&&NEEDS_CHECK.includes(bd.type))h+='<button class="btn big" data-act="bcheck">Check</button>';
  if(b.msg&&!done)h+=`<p class="nudge" role="status">${b.msg}</p>`;
  if(b.done&&q.followup)h+=`<div class="follow"><div class="qhead"><p class="prompt sm">${q.followup.prompt}</p>${speakBtn('fspeak')}</div><div class="opts">${q.followup.options.map((o,i)=>optBtn(o,i,'fopt',Cur.fchosen,q.followup.answer)).join('')}</div></div>`;

    if(e.type==='mastered'){icon=starSVG('lit','big-star');title='A new star is lit!';text=`You've mastered ${esc(s.name)}.`;}
    else if(e.type==='up'){icon=ICON.up.replace('<svg','<svg class="big-star"');title='Level up!';text=`You're ready for ${esc(s.name)} with ${STAGE_WITH[e.stage]}.`;}
    else if(e.type==='down'){icon=ICON.shift.replace('<svg','<svg class="big-star"');title="Let's switch it up";text=`Let's try ${esc(s.name)} with ${STAGE_WITH[e.stage]} for a bit. It makes it easier to see what's going on. You'll move back up soon.`;}
    else if(e.type==='prereq'){icon=ICON.shift.replace('<svg','<svg class="big-star"');title='Quick warm-up';text=`Let's practise ${esc(SK[e.to].name)} for a bit. It will make ${esc(s.name)} easier.`;}
    else{icon=ICON.shift.replace('<svg','<svg class="big-star"');title='Quick refresh';text=`Let's brush up on ${esc(s.name)} for a few questions.`;}
    body=`<section class="card modal" role="dialog" aria-modal="true" aria-labelledby="mt">${icon}<h2 id="mt">${title}</h2><p class="mbody">${text}</p><button class="btn big" data-act="eventOk" data-focus>Keep going</button></section>`;}
  else if(m.type==='confirm')body=`<section class="card modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${m.title}</h2><p class="mbody">${m.text}</p><div class="row"><button class="btn secondary" data-act="closeModal" data-focus>Cancel</button><button class="btn" data-act="${m.act}">${m.yes}</button></div></section>`;
  else if(m.type==='star'){const s=SK[m.id],st=prof.skills[m.id],state=starState(m.id);
    const status=state==='lit'?'Mastered. It comes back in review now and then.':state==='now'?`Practising now at the ${STAGES[st.stage].toLowerCase()} level.`:state==='open'?'Ready to start.':`Unlocks after ${s.pre.map(id=>SK[id].name).join(' and ')}.`;
    body=`<section class="card modal" role="dialog" aria-modal="true" aria-labelledby="mt">${starSVG(state==='lit'?'lit':'now','big-star')}<h2 id="mt">${esc(s.name)}</h2><p class="mbody">${s.kid}</p><p class="mbody muted">${status}</p>${state==='open'?`<button class="btn big" data-act="focusSkill" data-d="${m.id}">Practise this next</button>`:''}<button class="btn secondary" data-act="closeModal" data-focus>Close</button></section>`;}
  else if(m.type==='chart'){const hi=m.hi||[0,0];let t='<table class="chartgrid"><thead><tr><th scope="col">×</th>';for(let c=1;c<=10;c++)t+=`<th scope="col">${c}</th>`;t+='</tr></thead><tbody>';
    for(let r=1;r<=10;r++){t+=`<tr><th scope="row">${r}</th>`;for(let c=1;c<=10;c++){const cls=(r===hi[0]&&c===hi[1])?'hx':(r===hi[0]||c===hi[1])?'hl':'';t+=`<td class="${cls}" data-act="chartcell" data-i="${r}" data-d="${c}">${r*c}</td>`;}t+='</tr>';}
    body=`<section class="card modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Times chart</h2><p class="mbody small muted">Tap a number to light up its row and column. Using the chart counts like a hint.</p><div class="chartwrap">${t}</tbody></table></div><button class="btn big" data-act="closeModal" data-focus>Back to the question</button></section>`;}
  return `<div class="scrim">${body}</div>`;}

// ---------- session flow ----------
function beginSession(mode,n){S={mode,n:mode==='placement'?12:n,i:0,answered:0,correct:0,gems:0,start:Date.now(),events:[],P:mode==='placement'?placementInit():null,early:false};UI.screen='practice';nextQuestion();}
function nextQuestion(){let item;
  if(S.mode==='placement'){item=placementNext(S.P);if(!item)return finishPlacement();}
  else{if(S.i>=S.n)return finishSession(false);item=nextItem(prof,S);if(!item)return finishSession(false);}
  const sk=prof.skills[item.skill],easy=S.mode==='placement'?false:(!item.review&&sk.pL[item.stage]<0.5);
  let q;try{q=makeQuestion(item.skill,item.stage,easy);}catch(err){q=makeQuestion('quantity',1,true);}
  q.review=!!item.review;
  Cur={q,phase:'answer',hinted:false,hintShown:false,entry:'',chosen:null,fchosen:null,b:q.kind==='build'?initBuild(q.build):null,buildMiss:false};
  save();render();window.scrollTo(0,0);if(prof.settings.autoRead)speak(sayFor(q));}
function submit(ok,mis,o={}){if(!Cur||Cur.phase!=='answer')return;const q=Cur.q,hinted=Cur.hinted;
  Cur.phase='feedback';Cur.ok=ok;Cur.mis=ok?null:mis;Cur.unsure=!!o.unsure;let gain=1+(ok&&!hinted?1:0);
  if(S.mode==='placement'){placementRecord(S.P,ok);Cur.events=[];noteMis(prof,Cur.mis);prof.log.push({t:Date.now(),s:q.skill,g:q.stage,ok,p:1,m:Cur.mis});if(prof.log.length>400)prof.log.splice(0,prof.log.length-400);}
  else{const ev=record(prof,q.skill,q.stage,ok,{hinted,mis:Cur.mis,G:guessFor(q),review:q.review,unsure:Cur.unsure});Cur.events=ev;S.events.push(...ev);ev.forEach(x=>{if(x.type==='up')gain+=5;if(x.type==='back')gain+=2;if(x.type==='mastered')gain+=15;});}
  Cur.gain=gain;prof.gems+=gain;S.gems+=gain;S.i++;S.answered++;if(ok)S.correct++;markDay(prof);
  save();render();tone(ok?SND.ok:SND.soft);
  requestAnimationFrame(()=>{const fb=document.getElementById('fb');if(fb){fb.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'});const nb=fb.querySelector('[data-act="next"]');if(nb)nb.focus({preventScroll:true});}});}
const EV_ORDER=['mastered','up','back','prereq','refresh','down'];
function afterFeedback(){const ev=(Cur.events||[]).slice().sort((a,b)=>EV_ORDER.indexOf(a.type)-EV_ORDER.indexOf(b.type))[0];
  if(ev&&ev.type==='back'){nextQuestion();toast(`Back up to ${STAGE_WITH[ev.stage]} for ${SK[ev.skill].name}.`);return;}
  if(ev&&ev.type==='down'){S.downs=S.downs||{};if(S.downs[ev.skill]){nextQuestion();toast(`Trying it with ${STAGE_WITH[ev.stage]} for a bit.`);return;}S.downs[ev.skill]=1;}
  if(ev){UI.modal={type:'event',ev};render();if(ev.type==='mastered'||ev.type==='up'){tone(SND.up);if(ev.type==='mastered')confetti();}return;}
  nextQuestion();}
function finishSession(early){S.early=early;
  if(S.answered>0){prof.sessions.push({d:Date.now(),n:S.answered,c:S.correct,min:Math.max(1,Math.round((Date.now()-S.start)/60000)),m:S.mode});if(prof.sessions.length>100)prof.sessions.shift();
    if(!early){prof.gems+=5;S.gems+=5;}}
  save();Cur=null;UI.screen=S.answered>0?'summary':'home';render();window.scrollTo(0,0);if(UI.screen==='summary'&&!early){tone(SND.up);confetti();}}
function finishPlacement(){placementApply(prof,S.P);prof.sessions.push({d:Date.now(),n:S.answered,c:S.correct,min:Math.max(1,Math.round((Date.now()-S.start)/60000)),m:'placement'});
  save();Cur=null;UI.screen='placed';render();window.scrollTo(0,0);tone(SND.up);confetti();}
function buildCheck(){const q=Cur.q,b=Cur.b;if(Cur.phase!=='answer'||b.done)return;
  if(buildRight(q.build,b)){b.done=true;b.msg=null;if(!q.followup)return submit(!Cur.buildMiss,null);render();if(prof.settings.autoRead)speak(q.followup.say||strip(q.followup.prompt));return;}
  Cur.buildMiss=true;b.tries=(b.tries||0)+1;if(b.tries>=2)return submit(false,null);b.msg=buildNudge(q.build,b);render();}
function padKey(k){if(!Cur||Cur.phase!=='answer')return;
  if(k==='del')Cur.entry=Cur.entry.slice(0,-1);
  else if(k==='ok'){if(!Cur.entry)return;const v=parseInt(Cur.entry,10),ok=v===Cur.q.answer;return submit(ok,ok?null:((Cur.q.padMis&&Cur.q.padMis[v])||null));}
  else if(Cur.entry.length<4)Cur.entry=(Cur.entry==='0'?'':Cur.entry)+k;
  render();}

// ---------- actions ----------
const B=()=>Cur&&Cur.phase==='answer'&&Cur.b&&!Cur.b.done;
const ACT={
 start(){beginSession('practice',prof.settings.sessionLen);},
 more(){beginSession('practice',5);},
 home(){UI.screen='home';UI.modal=null;render();window.scrollTo(0,0);},
 back(){UI.tmp={};routeHome();},
 shop(){UI.screen='shop';render();window.scrollTo(0,0);},
 star(el){UI.modal={type:'star',id:el.dataset.d};renderLayer();},
 focusSkill(el){prof.focus=el.dataset.d;save();UI.modal=null;render();toast('Next practice: '+SK[el.dataset.d].name);},
 closeModal(){UI.modal=null;render();},
 opt(el){if(!Cur||Cur.phase!=='answer')return;const o=Cur.q.options[+el.dataset.i];Cur.chosen=+el.dataset.i;submit(String(o.value)===String(Cur.q.answer),o.mis||null);},
 fopt(el){if(!Cur||Cur.phase!=='answer')return;const f=Cur.q.followup,o=f.options[+el.dataset.i];Cur.fchosen=+el.dataset.i;const fok=String(o.value)===String(f.answer);submit(fok&&!Cur.buildMiss,fok?null:(o.mis||null));},
 key(el){padKey(el.dataset.d);},
 hint(){if(!Cur)return;Cur.hintShown=true;Cur.hinted=true;render();},
 unsure(){submit(false,null,{unsure:true});},
 chart(){if(!Cur)return;Cur.hinted=true;UI.modal={type:'chart',hi:null};render();},
 chartcell(el){UI.modal.hi=[+el.dataset.i,+el.dataset.d];renderLayer();},
 speak(){if(Cur)speak(sayFor(Cur.q));},
 fspeak(){if(Cur&&Cur.q.followup)speak(Cur.q.followup.say||strip(Cur.q.followup.prompt));},
 next(){afterFeedback();},
 quit(){UI.modal={type:'confirm',title:'Stop for now?',text:S.mode==='placement'?'You can do the warm-up again later.':'Everything you\'ve done so far is saved.',yes:'Stop',act:'doQuit'};renderLayer();},
 doQuit(){UI.modal=null;if(S.mode==='placement'){Cur=null;routeHome();return;}finishSession(true);},
 eventOk(){UI.modal=null;nextQuestion();},
 cell(el){if(!B())return;const i=+el.dataset.i,c=Cur.b.cells;if(c[i]===2)return;c[i]=c[i]?0:1;Cur.b.msg=null;render();},
 blk(el){if(!B())return;const [k,d]=[el.dataset.d[0],el.dataset.d[1]],mx=k==='h'?3:9,b=Cur.b;b[k]=Math.max(0,Math.min(mx,b[k]+(d==='+'?1:-1)));b.msg=null;render();},
 nltap(el,e){if(!B())return;const bd=Cur.q.build,r=el.getBoundingClientRect();const xs=(e.clientX-r.left)/r.width*NL.W;let v=Math.round(bd.min+(xs-NL.L)/(NL.R-NL.L)*(bd.max-bd.min));Cur.b.m=Math.max(bd.min,Math.min(bd.max,v));Cur.b.msg=null;render();},
 nlnudge(el){if(!B())return;const bd=Cur.q.build;const d=+el.dataset.d;let m=Cur.b.m===null?(d>0?bd.min+1:bd.max-1):Cur.b.m+d;Cur.b.m=Math.max(bd.min,Math.min(bd.max,m));Cur.b.msg=null;render();},
 jump(el){if(!B())return;const b=Cur.b,d=+el.dataset.d;if(b.pos+d>b.hi)return;b.hist.push([b.pos,b.pos+d]);b.pos+=d;b.msg=null;render();},
 jundo(){if(!B())return;const b=Cur.b,j=b.hist.pop();if(j)b.pos=j[0];b.msg=null;render();},
 jdone(){buildCheck();},
 cross(el){if(!B())return;const i=+el.dataset.i;Cur.b.x[i]=!Cur.b.x[i];Cur.b.msg=null;render();},
 grp(el){if(!B())return;const k=el.dataset.d[0],d=el.dataset.d[1],b=Cur.b;b[k]=Math.max(1,Math.min(6,b[k]+(d==='+'?1:-1)));b.msg=null;render();},
 row(el){if(!B())return;const b=Cur.b;b.r=Math.max(0,Math.min(10,b.r+(el.dataset.d==='+'?1:-1)));b.msg=null;render();},
 plate(el){if(!B())return;const bd=Cur.q.build,b=Cur.b,i=+el.dataset.i;const left=bd.n-b.plates.reduce((a,c)=>a+c,0);if(left<=0)return;b.plates[i]++;b.hist.push(i);b.msg=null;
   if(left-1===0){buildCheck();return;}render();},
 sundo(){if(!B())return;const b=Cur.b,i=b.hist.pop();if(i!==undefined)b.plates[i]--;b.msg=null;render();},
 mkgrp(){if(!B())return;const bd=Cur.q.build,b=Cur.b;if(bd.n-b.g*bd.k<bd.k)return;b.g++;if(b.g*bd.k===bd.n){buildCheck();return;}render();},
 part(el){if(!B())return;const i=+el.dataset.i;Cur.b.s[i]=!Cur.b.s[i];Cur.b.msg=null;render();},
 bcheck(){buildCheck();},
 pickAv(el){UI.tmp.av=el.dataset.d;render();},
 buyAv(el){const a=el.dataset.d,price=(AVATARS.find(x=>x[0]===a)||[a,0])[1];
   if(prof.owned.avatars.includes(a)||price===0){prof.avatar=a;save();render();return;}
   if(prof.gems<price){toast(`You need ${price-prof.gems} more gems for that one.`);return;}
   prof.gems-=price;prof.owned.avatars.push(a);prof.avatar=a;save();render();tone(SND.up);toast('Unlocked!');},
 buyTheme(el){const k=el.dataset.d,t=THEMES[k];if(!t)return;
   if(prof.owned.themes.includes(k)||t.price===0){prof.theme=k;save();render();return;}
   if(prof.gems<t.price){toast(`You need ${t.price-prof.gems} more gems for that one.`);return;}
   prof.gems-=t.price;prof.owned.themes.push(k);prof.theme=k;save();render();tone(SND.up);toast('Unlocked!');},
 set(el){const k=el.dataset.k,v=el.dataset.v;prof.settings[k]=v==='true'?true:v==='false'?false:(isNaN(+v)?v:+v);save();render();},
 copyBackup(){const code=JSON.stringify({numbersky:1,profile:prof});UI.tmp.code=code;render();
   try{navigator.clipboard.writeText(code).then(()=>toast('Backup code copied.'),()=>toast('Select the code below and copy it.'));}catch(e){toast('Select the code below and copy it.');}},
 doRestore(){const np=UI.tmp.restore;UI.tmp.restore=null;UI.modal=null;if(!np)return;APP.profiles[np.id]=np;APP.current=np.id;save();toast('Progress restored.');routeHome();},
 redo(){UI.modal={type:'confirm',title:'Redo the warm-up?',text:`${esc(prof.name)}'s skill levels will be set again from a new warm-up. Gems and buddies stay.`,yes:'Redo warm-up',act:'doRedo'};renderLayer();},
 doRedo(){UI.modal=null;prof.placementDone=false;save();routeHome();},
 reset(){UI.modal={type:'confirm',title:'Reset all progress?',text:`This clears ${esc(prof.name)}'s skill levels, patterns and history. Gems and buddies stay. This can't be undone.`,yes:'Reset',act:'doReset'};renderLayer();},
 doReset(){UI.modal=null;const fresh=newProfile(prof.name,prof.avatar);Object.assign(prof,{skills:fresh.skills,focus:null,mis:{},log:[],sessions:[],days:[],placementDone:false});save();routeHome();},
 switchTo(el){APP.current=el.dataset.d;save();routeHome();},
 addLearner(){UI.tmp={adding:true};UI.screen='welcome';render();window.scrollTo(0,0);},
 beginPlace(){beginSession('placement');},
 skipPlace(){placementApply(prof,{lo:0,tested:{}});save();UI.screen='home';render();},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e);}});
document.addEventListener('input',e=>{if(e.target.id==='pname')UI.tmp.name=e.target.value;});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='newp'){const name=(document.getElementById('pname').value||'').trim();if(!name){document.getElementById('pname').focus();return;}
    const p=newProfile(name.slice(0,20),UI.tmp.av||'🦊');APP.profiles[p.id]=p;APP.current=p.id;UI.tmp={};save();routeHome();}
  if(e.target.id==='restoreForm'){const txt=(document.getElementById('restoreText').value||'').trim();let obj=null;try{obj=JSON.parse(txt);}catch(err){}
    if(!obj||!obj.profile||!obj.profile.skills||!obj.profile.id){toast("That code doesn't look right. Paste the whole backup code.");return;}
    UI.tmp.restore=obj.profile;UI.modal={type:'confirm',title:`Restore ${esc(obj.profile.name||'this learner')}?`,text:'This replaces the saved progress for that learner on this page.',yes:'Restore',act:'doRestore'};renderLayer();}});
document.addEventListener('keydown',e=>{
  if(UI.modal&&e.key==='Escape'){e.preventDefault();if(UI.modal.type==='event')ACT.eventOk();else ACT.closeModal();return;}
  if(UI.screen==='practice'&&Cur&&Cur.phase==='answer'&&Cur.q.kind==='pad'&&!UI.modal){
    if(/^[0-9]$/.test(e.key)){e.preventDefault();padKey(e.key);}else if(e.key==='Backspace'){e.preventDefault();padKey('del');}else if(e.key==='Enter'){e.preventDefault();padKey('ok');}}
  const h=e.target.closest&&e.target.closest('[data-hold]');if(h&&(e.key==='Enter'||e.key===' ')){e.preventDefault();if(!e.repeat)holdStart(h);}});
document.addEventListener('keyup',e=>{const h=e.target.closest&&e.target.closest('[data-hold]');if(h&&(e.key==='Enter'||e.key===' '))holdEnd(h,true);});
// press-and-hold gate for the grown-up view
let holdT=null;
function holdStart(el){if(holdT)return;el.classList.add('holding');holdT=setTimeout(()=>{holdT=null;el.classList.remove('holding');UI.tmp.code=null;UI.screen='grown';render();window.scrollTo(0,0);},1200);}
function holdEnd(el,hint){if(holdT){clearTimeout(holdT);holdT=null;if(hint)toast('Keep holding to open the grown-up view.');}if(el)el.classList.remove('holding');}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-hold]');if(el)holdStart(el);});
document.addEventListener('pointerup',e=>{const el=e.target.closest&&e.target.closest('[data-hold]');holdEnd(el||document.querySelector('[data-hold]'),!!el);});
document.addEventListener('pointercancel',()=>holdEnd(document.querySelector('[data-hold]')));
document.addEventListener('pointerleave',e=>{if(e.target&&e.target.closest&&e.target.closest('[data-hold]'))holdEnd(e.target.closest('[data-hold]'));},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-hold]'))e.preventDefault();});

// ---------- boot ----------
function start(){setProf();UI.screen='boot';render();const ready={done:false};const go=()=>{if(ready.done)return;ready.done=true;routeHome();};
  setTimeout(go,1600);connect(ready).then(go,go);initTTS();}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({}));
if(hot&&hot.ready)hot.ready(start);else start();
</script>
